---
- name: HP EliteDesk Zero Trust Host Hardening & Stack Deployment
  hosts: localhost
  become: true
  vars_files:
    - group_vars/all.yml

  roles:
    - role: os-hardening
    - role: ssh-tailscale-lockdown
    - role: docker-hardening
    - role: beszel-agent-host
    - role: stack-deploy
      tags: [deploy]
      when: run_stack_deploy | default(false) | bool
