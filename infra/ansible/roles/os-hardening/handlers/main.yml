---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart zram
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: restarted
  failed_when: false

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Reload ufw
  ansible.builtin.command: ufw reload
  changed_when: false
