networks:
  net_public_tunnel:
    name: net_public_tunnel
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.28.1.0/28

  net_public_ingress:
    name: net_public_ingress
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/28

