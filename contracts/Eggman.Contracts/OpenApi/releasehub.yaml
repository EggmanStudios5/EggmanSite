openapi: 3.1.0
info:
  title: Eggman.ReleaseHub API
  version: 1.0.0
  description: Zero Trust artifact release service for AltStore/SideStore IPAs, Macro/ESP32 firmware OTA, and game builds (Sluníčka, Protikód).
servers:
  - url: https://releases.eggmanstudios.me
paths:
  /api/v1/altstore/source.json:
    get:
      summary: Fetch AltStore/SideStore source manifest with SHA-256 checksums
      responses:
        "200":
          description: AltStore JSON manifest
  /api/v1/firmware:
    get:
      summary: List signed firmware manifests for Eggman hardware
      responses:
        "200":
          description: List of firmware manifests
  /api/v1/games:
    get:
      summary: List verified builds for Sluníčka and Protikód
      responses:
        "200":
          description: List of game builds
  /api/v1/releases/{kind}/{fileName}:
    get:
      summary: Download release binary with X-Checksum-Sha256 header
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [ipa, firmware, games]
        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary stream
        "404":
          description: Artifact not found
  /api/v1/releases:
    post:
      summary: Register release metadata (Keycloak JWT + releases:write scope required)
      security:
        - keycloakBearer: [releases:write]
      responses:
        "201":
          description: Release recorded
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing releases:write scope
  /api/releases/uploads/init:
    post:
      summary: Initialize resumable chunked release upload session (requires releases:publish)
      security:
        - keycloakBearer: [releases:publish]
      responses:
        "201":
          description: Upload session initialized
        "400":
          description: Validation failure
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing releases:publish scope
  /api/releases/uploads/{uploadId}/chunks/{chunkIndex}:
    put:
      summary: Stream raw binary chunk up to 55MB (requires releases:publish)
      security:
        - keycloakBearer: [releases:publish]
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chunkIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Chunk staged
        "400":
          description: Invalid chunk index or cumulative size exceeded
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing releases:publish scope or session ownership mismatch
        "413":
          description: Chunk exceeds 55MB limit (60MB at YARP edge)
  /api/releases/uploads/{uploadId}/complete:
    post:
      summary: Assemble verified chunks, check SHA-256, and promote release atomically (requires releases:publish)
      security:
        - keycloakBearer: [releases:publish]
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Verified artifact promoted and catalog updated
        "400":
          description: Missing chunks
        "401":
          description: Missing or invalid JWT
        "403":
          description: Missing releases:publish scope or session ownership mismatch
        "422":
          description: Final SHA-256 digest mismatch; staging purged
components:
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
